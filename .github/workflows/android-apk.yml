name: Lotty Go Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Lotty Go
        uses: actions/checkout@v4
        with:
          ref: feature/full-platform-build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair and validate the app icon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          path = Path("assets/icon.png")
          try:
              image = Image.open(path).convert("RGBA")
              image = image.resize((1024, 1024), Image.Resampling.LANCZOS)
          except Exception:
              image = Image.new("RGBA", (1024, 1024), "#0B0B0D")
              draw = ImageDraw.Draw(image)
              font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
              top_font = ImageFont.truetype(font_path, 154)
              bottom_font = ImageFont.truetype(font_path, 190)
              gold = "#D4AF37"
              for text, font, y in [("LOTTY", top_font, 365), ("GO", bottom_font, 525)]:
                  box = draw.textbbox((0, 0), text, font=font, stroke_width=0)
                  x = (1024 - (box[2] - box[0])) // 2
                  draw.text((x, y), text, font=font, fill=gold)
              draw.rounded_rectangle((100, 100, 924, 924), radius=72, outline="#8C6A15", width=5)
          image.save(path, format="PNG", optimize=True)
          Image.open(path).verify()
          print("App icon is now a valid optimized PNG.")
          PY

      - name: Align Expo packages with the installed SDK
        run: npx expo install --fix

      - name: Check Expo configuration
        run: npx expo config --type public

      - name: Build Android APK with Expo EAS
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
