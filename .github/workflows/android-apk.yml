name: Lotty Go Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete Lotty Go app
        uses: actions/checkout@v4
        with:
          # The complete app (including assets/icon.png) currently lives here.
          ref: feature/full-platform-build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair and validate the Lotty Go app icon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          path = Path("assets/icon.png")
          path.parent.mkdir(parents=True, exist_ok=True)

          # The checked-in icon is truncated. Rebuild a clean, deterministic
          # charcoal-and-gold icon in the build workspace before Expo packages it.
          image = Image.new("RGBA", (1024, 1024), "#0B0B0D")
          draw = ImageDraw.Draw(image)
          gold = "#D4AF37"
          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          top = ImageFont.truetype(font_path, 150)
          bottom = ImageFont.truetype(font_path, 230)

          for label, font, y in [("LOTTY", top, 340), ("GO", bottom, 500)]:
              bounds = draw.textbbox((0, 0), label, font=font, stroke_width=0)
              x = (1024 - (bounds[2] - bounds[0])) // 2
              draw.text((x, y), label, font=font, fill=gold)

          draw.rounded_rectangle((70, 70, 954, 954), radius=95, outline="#8C6A15", width=6)
          image.save(path, format="PNG", optimize=True)

          with Image.open(path) as check:
              check.verify()
          print("Rebuilt and verified clean Lotty Go icon:", path)
          PY

      - name: Verify Expo packages match the SDK (read-only)
        run: npx expo install --check

      - name: Check Expo configuration
        run: npx expo config --type public

      - name: Build Android APK with Expo EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@latest build --platform android --profile preview --non-interactive --json > build-result.json
          cat build-result.json

      - name: Attach the built APK to this workflow run
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID="$(node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("build-result.json","utf8"));const b=Array.isArray(r)?r[r.length-1]:r;process.stdout.write(String(b.id))')"
          echo "Build ID: $BUILD_ID"
          npx --yes eas-cli@latest build:view "$BUILD_ID" --json > build-view.json
          APK_URL="$(node -e 'const fs=require("fs");const b=JSON.parse(fs.readFileSync("build-view.json","utf8"));const a=b.artifacts||{};const u=a.applicationArchiveUrl||(a.applicationArchive&&a.applicationArchive.url)||a.buildUrl;if(!u){console.error(JSON.stringify(b,null,2));process.exit(1)}process.stdout.write(u)')"
          echo "APK URL: $APK_URL"
          curl --fail --location --retry 3 "$APK_URL" --output lotty-go.apk
          test -s lotty-go.apk
          ls -lh lotty-go.apk
          sha256sum lotty-go.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lotty-go-apk
          path: lotty-go.apk
