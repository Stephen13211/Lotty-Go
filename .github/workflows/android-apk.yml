name: Lotty Go Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Lotty Go
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair and validate the app icon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          path = Path("assets/icon.png")
          try:
              image = Image.open(path).convert("RGBA")
              image = image.resize((1024, 1024), Image.Resampling.LANCZOS)
          except Exception:
              image = Image.new("RGBA", (1024, 1024), "#0B0B0D")
              draw = ImageDraw.Draw(image)
              font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
              top_font = ImageFont.truetype(font_path, 154)
              bottom_font = ImageFont.truetype(font_path, 190)
              gold = "#D4AF37"
              for text, font, y in [("LOTTY", top_font, 365), ("GO", bottom_font, 525)]:
                  box = draw.textbbox((0, 0), text, font=font, stroke_width=0)
                  x = (1024 - (box[2] - box[0])) // 2
                  draw.text((x, y), text, font=font, fill=gold)
              draw.rounded_rectangle((100, 100, 924, 924), radius=72, outline="#8C6A15", width=5)
          image.save(path, format="PNG", optimize=True)
          Image.open(path).verify()
          print("App icon is now a valid optimized PNG.")
          PY

      - name: Verify Expo packages match the SDK (read-only)
        run: npx expo install --check

      - name: Check Expo configuration
        run: npx expo config --type public

      - name: Build Android APK with Expo EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@latest build --platform android --profile preview --non-interactive --json > build-result.json
          cat build-result.json

      - name: Attach the built APK to this workflow run
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID="$(node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("build-result.json","utf8"));const b=Array.isArray(r)?r[r.length-1]:r;process.stdout.write(String(b.id))')"
          echo "Build ID: $BUILD_ID"
          npx --yes eas-cli@latest build:view "$BUILD_ID" --json > build-view.json
          APK_URL="$(node -e 'const fs=require("fs");const b=JSON.parse(fs.readFileSync("build-view.json","utf8"));const a=b.artifacts||{};const u=a.applicationArchiveUrl||(a.applicationArchive&&a.applicationArchive.url)||a.buildUrl;if(!u){console.error(JSON.stringify(b,null,2));process.exit(1)}process.stdout.write(u)')"
          echo "APK URL: $APK_URL"
          curl --fail --location --retry 3 "$APK_URL" --output lotty-go.apk
          test -s lotty-go.apk
          ls -lh lotty-go.apk
          sha256sum lotty-go.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lotty-go-apk
          path: lotty-go.apk
