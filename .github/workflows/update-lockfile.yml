name: Update Lotty Go lockfile

on:
  push:
    branches:
      - feature/driver-background-availability
    paths:
      - .github/workflows/update-lockfile.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/driver-background-availability

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already up to date"
          else
            git commit -m "Update lockfile for background location and notifications"
            git push origin HEAD:feature/driver-background-availability
          fi
