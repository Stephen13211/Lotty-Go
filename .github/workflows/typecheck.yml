name: Lotty Go typecheck

on:
  pull_request:
    branches: [feature/full-platform-build, design/luxury-ui-refresh]
  push:
    branches: [feature/full-platform-build]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform android
